name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest -q

  build-windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pyinstaller --onefile --noconsole --uac-admin --name NetBlock netblock.py
      - name: Portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory Portable | Out-Null
          Copy-Item dist\NetBlock.exe Portable\NetBlock.exe
          Copy-Item PORTABLE.txt Portable\README.txt
          Compress-Archive -Path Portable\* -DestinationPath NetBlock-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NetBlock-portable
          path: NetBlock-portable.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: NetBlock-portable.zip
          generate_release_notes: true
